name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep

      - name: Validate plugin manifest JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null

      - name: Shellcheck
        run: |
          shellcheck scripts/*.sh

      - name: Basic marker scan smoke test
        run: |
          rg -n "(\\!\\!|\\?\\?|>>)" skills templates || true
